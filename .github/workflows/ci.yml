name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -e packages/prompttools-core
          pip install -e packages/promptcost
          pip install -e packages/promptfmt
          pip install -e packages/prompttest
          pip install -e packages/promptlint
          pip install -e packages/promptdiff
          pip install -e packages/promptvault
        if: needs.changes.outputs.code == 'true'

      - name: Lint with ruff
        run: ruff check .
        if: needs.changes.outputs.code == 'true'

      - name: Type check with mypy
        run: mypy packages/ --ignore-missing-imports
        if: needs.changes.outputs.code == 'true'

      - name: Run tests
        run: pytest
        if: needs.changes.outputs.code == 'true'
