[project]
name = "prompttools-monorepo"
version = "0.0.0"
description = "Monorepo for the prompttools suite"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = [
    "packages/prompttools-core/tests",
    "packages/promptcost/tests",
    "packages/promptfmt/tests",
    "packages/prompttest/tests",
    "packages/promptlint/tests",
    "packages/promptdiff/tests",
    "packages/promptvault/tests",
]
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Ruff\'s classic default rules, written out so a new ruff release cannot change them.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# No python_version: mypy checks against the Python that runs it (each CI matrix job).
warn_return_any = true
warn_unused_configs = true
# Each package has its own tests/conftest.py; mypy cannot check them as one tree.
exclude = ["/tests/"]
